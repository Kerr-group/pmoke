[package]
name = "pmoke"
version = "0.4.0"
edition = "2024"

[workspace]
members = [
  "crates/gpib-rs",
  "crates/instruments",
  "crates/pmoke-config-core",
  "crates/pmoke-web-wasm",
  "crates/prologix-rs",
  "xtask",
]

[dependencies]
instruments = { version = "0.2.4", path = "crates/instruments", default-features = false }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
serde_path_to_error = "0.1.20"
clap = { version = "4.6.5", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
pyo3 = { version = "0.29.0", features = ["auto-initialize"] }
numpy = "0.29.0"
console = "0.16.4"
indicatif = "0.18.6"
comfy-table = "7.2.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
clap_complete = "4.6.8"
csv = "1.4.0"
rayon = "1.12.0"
fasteval = "0.2.4"
num-complex = "0.4.6"
unicode-width = "0.2.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6.1"
dirs = "6.0.0"
fs2 = "0.4.3"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
default = ["hw-gpib"]

hw = ["hw-gpib"]
hw-core = []
hw-gpib = ["hw-core", "instruments/gpib"]
hw-prologix-tcp = ["hw-core", "instruments/prologix-tcp"]
hw-prologix-serial = ["hw-core", "instruments/prologix-serial"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bench]]
name = "performance"
harness = false
