[package]
name = "pmoke-analysis-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Dependency-light deterministic analysis kernels shared by pmoke and WebAssembly"
license = "Apache-2.0"
repository = "https://github.com/Kerr-group/pmoke"

[dependencies]
libm = "=0.2.16"
# A-010 backend spike: pinned minimum-feature linear algebra for the joint
# harmonic direct solver. no-default + std only (no macros/rand/serde/io).
nalgebra = { version = "=0.35.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
# WP-3 calibration artifact: canonical JSON bytes (Ryu, platform-independent)
# and SHA-256 identification. Both already in the lockfile as transitive
# dependencies, so no new supply-chain surface.
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dev-dependencies]
serde_json = "1.0.151"
