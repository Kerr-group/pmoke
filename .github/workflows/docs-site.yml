name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "crates/**"
      - "src/**"
      - "xtask/**"
      - ".github/workflows/docs-site.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
  pull_request:
    paths:
      - "website/**"
      - "crates/**"
      - "src/**"
      - "xtask/**"
      - ".github/workflows/docs-site.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this ref to the protected GitHub Pages environment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Dependency and secret policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked source for secrets
        shell: bash
        run: |
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" dir . --redact --no-banner --max-target-megabytes 10

      - name: Enforce Cargo advisory, license, and source policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories licenses sources

      - name: Enable pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: website/package.json

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "website/.node-version"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Enforce npm advisory and license policy
        working-directory: website
        run: |
          audit_exit=0
          pnpm audit --json > "${RUNNER_TEMP}/pnpm-audit.json" || audit_exit=$?
          node scripts/verify-audit.mjs "${RUNNER_TEMP}/pnpm-audit.json"
          if [ "${audit_exit}" -gt 1 ]; then
            exit "${audit_exit}"
          fi
          pnpm test:audit
          pnpm test:licenses

  build:
    name: Build static documentation artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      pages_artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-02
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: wasm-pack@0.15.0

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2.9.1
        with:
          shared-key: docs-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Validate shared config and analysis cores
        run: |
          cargo test --locked -p pmoke-config-core -p pmoke-analysis-core -p pmoke-web-wasm
          cargo clippy --locked -p pmoke-config-core -p pmoke-analysis-core -p pmoke-web-wasm --all-targets -- -D warnings
          cargo check --locked -p pmoke-analysis-core --target wasm32-unknown-unknown
          cargo check --locked -p pmoke-web-wasm --target wasm32-unknown-unknown

      - name: Verify generated references
        run: |
          cargo test --locked -p xtask
          cargo xtask docs-export
          git diff --exit-code -- website/generated website/public/config.schema.json website/content/docs/en/cli website/content/docs/ja/cli website/content/docs/en/configuration/reference.mdx website/content/docs/ja/configuration/reference.mdx

      - name: Enable pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: website/package.json

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "website/.node-version"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check
        working-directory: website
        run: |
          pnpm lint
          pnpm lint:ja
          pnpm lint:content
          pnpm lint:readme
          pnpm types:check

      - name: Build static site
        working-directory: website
        run: pnpm build

      - name: Verify search, AI resources, and export
        working-directory: website
        run: |
          pnpm test:search
          pnpm test:ai
          pnpm test:export

      - name: Upload static test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pmoke-docs-static-${{ github.sha }}
          path: website/out
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Package GitHub Pages preview artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out
          retention-days: 30
          include-hidden-files: true

  browser-quality:
    name: Browser, accessibility, and visual gates
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: website/package.json

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "website/.node-version"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Download static test artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pmoke-docs-static-${{ github.sha }}
          path: website/out

      - name: Install release browsers
        working-directory: website
        run: pnpm exec playwright install --with-deps chromium firefox webkit chrome

      - name: Run browser, accessibility, and visual gates
        working-directory: website
        run: pnpm test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pmoke-docs-browser-${{ github.sha }}
          path: |
            website/test-results
            website/playwright-report
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  lighthouse-quality:
    name: Lighthouse release gate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: website/package.json

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "website/.node-version"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Download static test artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pmoke-docs-static-${{ github.sha }}
          path: website/out

      - name: Install release browser
        working-directory: website
        run: pnpm exec playwright install --with-deps chrome

      - name: Run Lighthouse release gate
        working-directory: website
        run: pnpm test:lighthouse

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pmoke-docs-lighthouse-${{ github.sha }}
          path: website/.lighthouseci
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  deploy:
    name: Deploy GitHub Pages
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: [security, build, browser-quality, lighthouse-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      deployment_id: ${{ steps.evidence.outputs.deployment_id }}
      artifact_id: ${{ needs.build.outputs.pages_artifact_id }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Record deployment evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          deployment_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&environment=github-pages" \
            --jq '.[0].id // empty')
          test -n "${deployment_id}"
          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"
          {
            echo "### GitHub Pages release evidence"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}\`"
            echo "- Pages artifact: \`${{ needs.build.outputs.pages_artifact_id }}\`"
            echo "- Environment deployment: \`${deployment_id}\`"
            echo "- URL: ${{ steps.deployment.outputs.page_url }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  post-deploy:
    name: Verify deployed site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "website/.node-version"

      - name: Run deployment smoke test
        run: node website/scripts/smoke-deployment.mjs "${{ needs.deploy.outputs.page_url }}" "${{ github.sha }}"

      - name: Summarize verified release
        run: |
          {
            echo "### Verified production release"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Pages artifact: \`${{ needs.deploy.outputs.artifact_id }}\`"
            echo "- Environment deployment: \`${{ needs.deploy.outputs.deployment_id }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
