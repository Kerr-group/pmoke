name: Documentation site

on:
  push:
    paths:
      - "website/**"
      - "crates/pmoke-config-core/**"
      - "crates/pmoke-analysis-core/**"
      - "crates/pmoke-web-wasm/**"
      - "src/**"
      - "xtask/**"
      - ".github/workflows/docs-site.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "website/**"
      - "crates/pmoke-config-core/**"
      - "crates/pmoke-analysis-core/**"
      - "crates/pmoke-web-wasm/**"
      - "src/**"
      - "xtask/**"
      - ".github/workflows/docs-site.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Static export and browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Validate shared config and analysis cores
        run: |
          cargo test --locked -p pmoke-config-core -p pmoke-analysis-core -p pmoke-web-wasm
          cargo clippy --locked -p pmoke-config-core -p pmoke-analysis-core -p pmoke-web-wasm --all-targets -- -D warnings
          cargo check --locked -p pmoke-analysis-core --target wasm32-unknown-unknown
          cargo check --locked -p pmoke-web-wasm --target wasm32-unknown-unknown

      - name: Verify generated references
        run: |
          cargo test --locked -p xtask
          cargo xtask docs-export
          git diff --exit-code -- website/generated website/public/config.schema.json website/content/docs/en/cli website/content/docs/ja/cli website/content/docs/en/configuration/reference.mdx website/content/docs/ja/configuration/reference.mdx

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: "website/.node-version"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check
        working-directory: website
        run: |
          pnpm lint
          pnpm lint:ja
          pnpm lint:content
          pnpm types:check

      - name: Build static site
        working-directory: website
        run: pnpm build

      - name: Verify search, AI resources, and export
        working-directory: website
        run: |
          pnpm test:search
          pnpm test:ai
          pnpm test:export

      - name: Install Chromium
        working-directory: website
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: website
        run: pnpm test:e2e

      - name: Package GitHub Pages preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/out

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmoke-docs-visuals-${{ github.sha }}
          path: |
            website/test-results
            website/playwright-report
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4

  post-deploy:
    name: Verify deployed site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: "website/.node-version"

      - name: Run deployment smoke test
        run: node website/scripts/smoke-deployment.mjs "${{ needs.deploy.outputs.page_url }}"
