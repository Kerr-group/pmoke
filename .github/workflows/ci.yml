name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "website/.node-version"

      - name: Verify README links
        run: node website/scripts/verify-readme.mjs

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configure PyO3 environment
        run: python scripts/configure_pyo3_ci.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            pkg-config

      - name: Install linux-gpib userspace library
        run: |
          archive_sha256="1b37b8c6bbe4844827f89e4986bc9c7b38e9dae8650f5bfa697d161afe09d898"
          curl -fL --retry 3 -o /tmp/linux-gpib.tar.gz \
            "https://sourceforge.net/projects/linux-gpib/files/linux-gpib%20for%203.x.x%20and%202.6.x%20kernels/4.3.6/linux-gpib-4.3.6.tar.gz/download"
          echo "${archive_sha256}  /tmp/linux-gpib.tar.gz" | sha256sum --check
          tar -xzf /tmp/linux-gpib.tar.gz -C /tmp
          tar -xzf /tmp/linux-gpib-4.3.6/linux-gpib-user-4.3.6.tar.gz -C /tmp
          cd /tmp/linux-gpib-user-4.3.6
          ./configure --sysconfdir=/etc --disable-all-bindings --disable-documentation
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-02
        with:
          components: rustfmt, clippy

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.14.0"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          shared-key: workspace-all-features
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Moke harmonics calculation
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s src/moke/pytools -p "test_*.py"

      - name: Test Python utilities
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts -p "test_*.py"

      # `cargo check` is intentionally omitted: `cargo clippy` below type-checks
      # the identical target set, so a separate check would only recompile it.
      - name: Test
        shell: bash
        run: |
          start=$(date +%s)
          status=0
          cargo test --locked --workspace --lib --bins --tests --examples --all-features || status=$?
          end=$(date +%s)
          echo "TEST_WALL_TIME=$((end - start))s test-workspace-all-features"
          echo "TEST_WALL_TIME=$((end - start))s test-workspace-all-features" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  performance-smoke:
    name: Performance smoke test
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configure PyO3 environment
        run: python scripts/configure_pyo3_ci.py

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-02

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.14.0"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          shared-key: performance-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run deterministic smoke benchmark
        run: cargo bench --locked --no-default-features --bench performance -- --smoke

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  hardware-feature-slices:
    name: Hardware feature slices
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configure PyO3 environment
        run: python scripts/configure_pyo3_ci.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            pkg-config

      - name: Install linux-gpib userspace library
        run: |
          archive_sha256="1b37b8c6bbe4844827f89e4986bc9c7b38e9dae8650f5bfa697d161afe09d898"
          curl -fL --retry 3 -o /tmp/linux-gpib.tar.gz \
            "https://sourceforge.net/projects/linux-gpib/files/linux-gpib%20for%203.x.x%20and%202.6.x%20kernels/4.3.6/linux-gpib-4.3.6.tar.gz/download"
          echo "${archive_sha256}  /tmp/linux-gpib.tar.gz" | sha256sum --check
          tar -xzf /tmp/linux-gpib.tar.gz -C /tmp
          tar -xzf /tmp/linux-gpib-4.3.6/linux-gpib-user-4.3.6.tar.gz -C /tmp
          cd /tmp/linux-gpib-user-4.3.6
          ./configure --sysconfdir=/etc --disable-all-bindings --disable-documentation
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-02
        with:
          components: clippy

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.14.0"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          shared-key: linux-full-hardware
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # No separate `cargo check`: `cargo clippy` below checks identical targets.
      - name: Test gpib-rs
        shell: bash
        run: |
          start=$(date +%s)
          status=0
          cargo test --locked -p gpib-rs --lib --bins --tests --examples || status=$?
          end=$(date +%s)
          echo "TEST_WALL_TIME=$((end - start))s test-gpib-rs"
          echo "TEST_WALL_TIME=$((end - start))s test-gpib-rs" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Lint gpib-rs
        run: cargo clippy --locked -p gpib-rs --lib --bins --tests --examples -- -D warnings

      # No separate `cargo check`: `cargo clippy` below checks identical targets.
      - name: Test instruments gpib
        shell: bash
        run: |
          start=$(date +%s)
          status=0
          cargo test --locked -p instruments --lib --bins --tests --examples --no-default-features --features gpib || status=$?
          end=$(date +%s)
          echo "TEST_WALL_TIME=$((end - start))s test-instruments-gpib"
          echo "TEST_WALL_TIME=$((end - start))s test-instruments-gpib" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Lint instruments gpib
        run: cargo clippy --locked -p instruments --lib --bins --tests --examples --no-default-features --features gpib -- -D warnings

      # No separate `cargo check`: `cargo clippy` below checks identical targets.
      - name: Test pmoke Linux full build
        shell: bash
        run: |
          start=$(date +%s)
          status=0
          cargo test --locked -p pmoke --lib --bins --tests --examples || status=$?
          end=$(date +%s)
          echo "TEST_WALL_TIME=$((end - start))s test-pmoke-linux-full"
          echo "TEST_WALL_TIME=$((end - start))s test-pmoke-linux-full" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Lint pmoke Linux full build
        run: cargo clippy --locked -p pmoke --lib --bins --tests --examples -- -D warnings

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  windows-visa-check:
    name: Windows full compile check
    runs-on: windows-latest
    env:
      PYO3_PYTHON: python
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Configure PyO3 environment
        run: python scripts/configure_pyo3_ci.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-02
        with:
          components: clippy

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.14.0"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          shared-key: windows-full
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # No separate `cargo check`: `cargo clippy` below checks identical targets.
      - name: Lint gpib-rs VISA bindings
        run: cargo clippy --locked -p gpib-rs --lib -- -D warnings

      # No separate `cargo check`: `cargo clippy` below checks identical targets.
      - name: Lint instruments VISA integration
        run: cargo clippy --locked -p instruments --lib --no-default-features --features gpib -- -D warnings

      # No separate `cargo check`: `cargo clippy` below checks identical targets.
      - name: Lint pmoke Windows full build
        run: cargo clippy --locked -p pmoke --all-targets -- -D warnings

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  crate-feature-matrix:
    name: Crate feature suite (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suite: pmoke hw-prologix-serial
            cache-key: pmoke-serial
            profiles: |
              pmoke|hw-prologix-serial|--no-default-features --features hw-prologix-serial
          - os: windows-latest
            suite: pmoke hw-prologix-tcp
            cache-key: pmoke-tcp
            profiles: |
              pmoke|hw-prologix-tcp|--no-default-features --features hw-prologix-tcp
          - os: windows-latest
            suite: transport crates
            cache-key: transport-crates
            profiles: |
              instruments|prologix-serial|--no-default-features --features prologix-serial
              instruments|prologix-tcp|--no-default-features --features prologix-tcp
              prologix-rs|serial|--no-default-features --features serial
              prologix-rs|tcp|--no-default-features --features tcp
          - os: macos-14
            suite: pmoke hw tcp
            cache-key: macos-pmoke-tcp
            profiles: |
              pmoke|hw-prologix-tcp|--no-default-features --features hw-prologix-tcp
              instruments|prologix-tcp|--no-default-features --features prologix-tcp
          - os: macos-14
            suite: pmoke hw serial
            cache-key: macos-pmoke-serial
            profiles: |
              pmoke|hw-prologix-serial|--no-default-features --features hw-prologix-serial
              instruments|prologix-serial|--no-default-features --features prologix-serial
          - os: macos-14
            suite: pmoke bundle + prologix
            cache-key: macos-bundle-prologix
            profiles: |
              pmoke|macOS hardware bundle|--no-default-features --features hw-core,hw-prologix-tcp,hw-prologix-serial
              prologix-rs|tcp|--no-default-features --features tcp
              prologix-rs|serial|--no-default-features --features serial
          - os: ubuntu-latest
            suite: pmoke hw serial
            cache-key: ubuntu-pmoke-serial
            profiles: |
              pmoke|hw-prologix-serial|--no-default-features --features hw-prologix-serial
              instruments|prologix-serial|--no-default-features --features prologix-serial
          - os: ubuntu-latest
            suite: pmoke hw tcp
            cache-key: ubuntu-pmoke-tcp
            profiles: |
              pmoke|hw-prologix-tcp|--no-default-features --features hw-prologix-tcp
              instruments|prologix-tcp|--no-default-features --features prologix-tcp
          - os: ubuntu-latest
            suite: transport-a
            cache-key: ubuntu-transport-a
            profiles: |
              prologix-rs|tcp|--no-default-features --features tcp
              prologix-rs|no-default|--no-default-features
          - os: ubuntu-latest
            suite: transport-b
            cache-key: ubuntu-transport-b
            profiles: |
              instruments|no-default|--no-default-features
              prologix-rs|serial|--no-default-features --features serial
    env:
      PYO3_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configure PyO3 environment
        run: python scripts/configure_pyo3_ci.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-02
        with:
          components: clippy

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.14.0"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          shared-key: feature-suite-${{ matrix.os }}-${{ matrix.cache-key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test and lint feature profiles
        shell: bash
        env:
          FEATURE_PROFILES: ${{ matrix.profiles }}
        run: |
          status=0
          while IFS='|' read -r package label flags; do
            test -n "${package}" || continue
            profile_status=0
            read -r -a cargo_flags <<< "${flags}"
            echo "::group::${package} ${label}"
            # No `cargo check`: `cargo clippy` below checks identical targets.
            test_start=$(date +%s)
            if ! cargo test --locked -p "${package}" --lib --bins --tests --examples "${cargo_flags[@]}"; then
              profile_status=1
            fi
            test_end=$(date +%s)
            echo "TIMING ${package} ${label} test_wall=$((test_end - test_start))s"
            echo "TIMING ${package} ${label} test_wall=$((test_end - test_start))s" >> "${GITHUB_STEP_SUMMARY}"
            if ! cargo clippy --locked -p "${package}" --lib --bins --tests --examples "${cargo_flags[@]}" -- -D warnings; then
              profile_status=1
            fi
            echo "::endgroup::"
            if (( profile_status == 0 )); then
              echo "PASS  ${package} ${label}" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "FAIL  ${package} ${label}" >> "${GITHUB_STEP_SUMMARY}"
              status=1
            fi
          done <<< "${FEATURE_PROFILES}"
          exit "${status}"

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  analysis-portability:
    name: Analysis-only (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-14
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    env:
      PYO3_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configure PyO3 environment
        run: python scripts/configure_pyo3_ci.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-02
        with:
          components: clippy

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.14.0"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          shared-key: analysis-${{ matrix.os }}-${{ matrix.python }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `cargo check` is intentionally omitted: `cargo clippy` below type-checks
      # the identical target set, so a separate check would only recompile it.
      # The test scope excludes benches: `cargo test --all-targets` executed
      # benches/performance.rs (~25 min per job), which stays covered by the
      # performance-smoke job and the scheduled performance workflow instead.
      - name: Test analysis-only build
        shell: bash
        run: |
          start=$(date +%s)
          status=0
          cargo test --locked -p pmoke --lib --bins --tests --examples --no-default-features || status=$?
          end=$(date +%s)
          echo "TEST_WALL_TIME=$((end - start))s test-analysis-only"
          echo "TEST_WALL_TIME=$((end - start))s test-analysis-only" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Lint analysis-only build
        run: cargo clippy --locked -p pmoke --all-targets --no-default-features -- -D warnings

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
